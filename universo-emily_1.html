<title>Universo de Emily</title>
<style>
  /* Design plan
     Color — deliberate single dark-cosmic world (no light variant; a night sky has no light-mode equivalent):
       --void-950 #170a26  --void-900 #20103a  --void-800 #2d1550
       --nebula-500 #7c3aed  --nebula-300 #b48bf2
       --rose-600 #d43a6e  --rose-500 #ef4b7f  --rose-300 #ffb6cf  --gold-200 #ffdfa8
       --ink-050 #fff6f4  --ink-300 #e3c9e6
     Type — display "Cormorant Garamond" italic (the name), script "Parisienne" (a single signature line),
            body "Jost" (label + message, light and quiet so the serif carries the moment).
     Layout — full-bleed fixed night scene; a drifting field of small tulip-constellations at three depths,
               one large bloom rising behind centered text. */

  @font-face { font-display: swap; }
  * { box-sizing: border-box; }

  :root {
    --void-950: #170a26;
    --void-900: #20103a;
    --void-800: #2d1550;
    --nebula-500: #7c3aed;
    --nebula-300: #b48bf2;
    --rose-600: #d43a6e;
    --rose-500: #ef4b7f;
    --rose-300: #ffb6cf;
    --gold-200: #ffdfa8;
    --stem-500: #5c5480;
    --ink-050: #fff6f4;
    --ink-300: #e3c9e6;
    --ink-400: #b79bc4;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--void-950);
    color: var(--ink-050);
    overflow: hidden;
  }

  body {
    font-family: 'Jost', ui-sans-serif, system-ui, sans-serif;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100dvh;
    min-height: 480px;
    overflow: hidden;
    background:
      radial-gradient(60% 50% at 50% 18%, rgba(180, 139, 242, 0.30), transparent 70%),
      radial-gradient(70% 55% at 80% 85%, rgba(239, 75, 127, 0.20), transparent 70%),
      radial-gradient(80% 65% at 15% 80%, rgba(124, 58, 237, 0.25), transparent 70%),
      linear-gradient(180deg, var(--void-950) 0%, var(--void-900) 55%, var(--void-800) 100%);
  }

  canvas#stars {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* tulip symbol field */
  .tulip-field {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .tulip-inst {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--w);
    height: auto;
    opacity: 0;
    filter:
      hue-rotate(var(--hue, 0deg))
      drop-shadow(0 0 calc(var(--w) * 0.09) var(--glow));
    transform: translate(-50%, -50%) rotate(var(--r, 0deg));
    transition: opacity 1.1s ease var(--delay, 0s);
    will-change: transform;
  }

  .stage.revealed .tulip-inst {
    opacity: var(--o, 0.7);
    animation: drift var(--dur, 9s) ease-in-out var(--delay, 0s) infinite alternate;
  }

  @keyframes drift {
    from { transform: translate(-50%, -50%) rotate(calc(var(--r, 0deg) - 3deg)) translateY(0); }
    to   { transform: translate(-50%, -50%) rotate(calc(var(--r, 0deg) + 3deg)) translateY(-14px); }
  }

  /* small planets drifting among the tulips, for a fuller "universe" feel */
  .orbit-field {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
  }

  .planet-inst {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--w);
    height: var(--w);
    border-radius: 50%;
    opacity: 0;
    transform: translate(-50%, -50%);
    background: var(--pgrad);
    box-shadow:
      0 0 calc(var(--w) * 0.55) var(--glow2),
      inset -18% -14% 30% rgba(0, 0, 0, 0.4),
      inset 12% 10% 24% rgba(255, 255, 255, 0.18);
    transition: opacity 1.2s ease var(--delay, 0s);
  }

  .planet-inst.ringed::after {
    content: '';
    position: absolute;
    inset: -42% -6%;
    border: 1.5px solid rgba(255, 223, 168, 0.5);
    border-radius: 50%;
    transform: rotate(-16deg);
  }

  .stage.revealed .planet-inst {
    opacity: var(--o, 0.7);
    animation: drift var(--dur, 10s) ease-in-out var(--delay, 0s) infinite alternate;
  }

  /* short affectionate notes drifting like little constellations */
  .notes-field {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
  }

  .note {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: clamp(38px, 9vw, 54px);
    aspect-ratio: 1;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255, 223, 168, 0.45);
    border-radius: 50%;
    appearance: none;
    background:
      radial-gradient(circle at 35% 30%, rgba(255, 223, 168, 0.3), rgba(124, 58, 237, 0.24) 55%, rgba(23, 10, 38, 0.6) 100%);
    font-family: 'Cormorant Garamond', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(1rem, 3.2vw, 1.25rem);
    color: var(--gold-200);
    text-shadow: 0 0 10px rgba(255, 223, 168, 0.6);
    box-shadow: 0 0 16px rgba(180, 139, 242, 0.4);
    opacity: 0;
    cursor: pointer;
    pointer-events: auto;
    transform: translate(-50%, -50%) rotate(var(--r, 0deg));
    transition: opacity 1.3s ease var(--delay, 0s), box-shadow 0.2s ease;
  }

  .note:hover,
  .note:focus-visible {
    box-shadow: 0 0 28px rgba(255, 223, 168, 0.65);
  }

  .note:focus-visible {
    outline: 1px solid rgba(255, 223, 168, 0.8);
    outline-offset: 5px;
  }

  .stage.revealed .note {
    opacity: var(--o, 0.8);
    animation: noteFloat var(--dur, 10s) ease-in-out var(--delay, 0s) infinite alternate;
  }

  @keyframes noteFloat {
    from { transform: translate(-50%, -50%) rotate(var(--r, 0deg)) translateY(0); }
    to   { transform: translate(-50%, -50%) rotate(var(--r, 0deg)) translateY(-10px); }
  }

  .hero-tulip {
    position: absolute;
    left: 50%;
    top: 46%;
    width: min(46vw, 300px);
    transform: translate(-50%, -30%) scale(0.72);
    opacity: 0;
    margin: 0;
    padding: 0;
    border: none;
    appearance: none;
    background: none;
    display: block;
    cursor: pointer;
    filter: drop-shadow(0 0 34px rgba(255, 223, 168, 0.45)) drop-shadow(0 0 70px rgba(239, 75, 127, 0.35));
    transition: filter 0.25s ease;
    z-index: 2;
  }

  .hero-tulip svg {
    display: block;
    width: 100%;
    height: auto;
    pointer-events: none;
  }

  .hero-tulip:hover,
  .hero-tulip:focus-visible {
    filter: drop-shadow(0 0 44px rgba(255, 223, 168, 0.62)) drop-shadow(0 0 90px rgba(239, 75, 127, 0.48));
  }

  .hero-tulip:focus-visible {
    outline: 2px solid rgba(255, 223, 168, 0.75);
    outline-offset: 12px;
    border-radius: 50%;
  }

  .stage.revealed .hero-tulip {
    animation: bloom 1.8s cubic-bezier(.2, .8, .3, 1) 0.15s forwards;
  }

  @keyframes bloom {
    from { opacity: 0; transform: translate(-50%, -30%) scale(0.72); }
    to   { opacity: 0.95; transform: translate(-50%, -38%) scale(1); }
  }

  /* eclipse-moon cover: the page opens here, a touch reveals the universe beneath */
  .cover {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(1.6rem, 5vh, 2.4rem);
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0 6vw;
    border: none;
    appearance: none;
    background: radial-gradient(50% 42% at 50% 46%, rgba(23, 10, 38, 0.6), transparent 72%);
    color: inherit;
    font: inherit;
    cursor: pointer;
    transition: opacity 0.9s ease;
  }

  .cover.hide {
    opacity: 0;
    pointer-events: none;
  }

  .moon-wrap {
    position: relative;
    width: clamp(100px, 28vw, 168px);
    aspect-ratio: 1;
  }

  .moon {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 37% 32%, #ffb37a 0%, #e07a4a 22%, #b8492f 42%, #7a2a30 64%, #3a1420 84%, #170a12 100%);
    box-shadow:
      0 0 44px 12px rgba(255, 138, 92, 0.42),
      0 0 100px 34px rgba(180, 70, 110, 0.26),
      inset -22px -16px 46px rgba(0, 0, 0, 0.55),
      inset 14px 10px 34px rgba(255, 205, 160, 0.22);
    animation: moonGlow 5s ease-in-out infinite alternate;
  }

  @keyframes moonGlow {
    from { filter: brightness(1); }
    to   { filter: brightness(1.14); }
  }

  .tap-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(255, 223, 168, 0.55);
    opacity: 0;
    animation: ping 2.6s ease-out infinite;
  }

  @keyframes ping {
    0%   { transform: scale(0.9); opacity: 0.55; }
    80%  { transform: scale(1.4); opacity: 0; }
    100% { transform: scale(1.4); opacity: 0; }
  }

  .tap-hint {
    margin: 0;
    text-align: center;
    font-size: 0.78rem;
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-300);
    animation: hintFade 2.6s ease-in-out infinite;
  }

  @keyframes hintFade {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }

  .content {
    position: relative;
    z-index: 3;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    text-align: center;
    padding: 0 6vw 8vh;
    gap: 0.9rem;
    pointer-events: none;
  }

  .tulip-hint {
    margin: 0.3rem 0 0;
    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink-400);
    opacity: 0;
    transition: opacity 1s ease;
  }

  .tulip-hint.show {
    opacity: 1;
  }

  h1.name {
    margin: 0;
    font-family: 'Cormorant Garamond', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(3.2rem, 13vw, 6.4rem);
    line-height: 1;
    letter-spacing: 0.01em;
    text-wrap: balance;
    background: linear-gradient(90deg, var(--gold-200), var(--rose-300) 55%, var(--nebula-300));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 46px rgba(239, 75, 127, 0.35);
    opacity: 0;
  }

  .stage.revealed h1.name {
    animation: rise 1.1s ease both 0.75s;
  }

  p.message {
    margin: 0;
    max-width: 32ch;
    font-size: clamp(1rem, 3.4vw, 1.25rem);
    font-weight: 300;
    line-height: 1.5;
    color: var(--ink-300);
    text-wrap: balance;
    opacity: 0;
  }

  .stage.revealed p.message {
    animation: rise 1s ease both 1.05s;
  }

  p.signature {
    margin: 0.4rem 0 0;
    font-family: 'Parisienne', cursive;
    font-size: clamp(1.15rem, 4vw, 1.5rem);
    color: var(--gold-200);
    opacity: 0;
  }

  .stage.revealed p.signature {
    animation: rise 1s ease both 1.35s;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .shooting-star {
    position: absolute;
    top: 18%;
    left: 10%;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: var(--ink-050);
    opacity: 0;
    box-shadow: 0 0 6px 1px rgba(255, 246, 244, 0.8);
    animation: shoot 7s linear 2.6s infinite;
  }

  .shooting-star.two {
    top: 62%;
    left: 78%;
    animation-duration: 9s;
    animation-delay: 5.2s;
  }

  @keyframes shoot {
    0%   { opacity: 0; transform: translate(0, 0); }
    2%   { opacity: 1; }
    12%  { opacity: 0; transform: translate(-32vw, 22vh); }
    100% { opacity: 0; transform: translate(-32vw, 22vh); }
  }

  @media (prefers-reduced-motion: reduce) {
    .tulip-inst, .planet-inst, .note, .hero-tulip, h1.name, p.message, p.signature,
    .shooting-star, .moon, .tap-ring, .tap-hint, .cover {
      animation: none !important;
    }
    .cover { transition: opacity 0.3s ease; }
    .tulip-inst, .planet-inst, .note, .tulip-hint { transition: opacity 0.3s ease; }
    .stage.revealed .hero-tulip { opacity: 0.95; }
    .stage.revealed h1.name,
    .stage.revealed p.message,
    .stage.revealed p.signature { opacity: 1; }
    .stage.revealed .tulip-inst { opacity: var(--o, 0.7); }
    .stage.revealed .planet-inst { opacity: var(--o, 0.7); }
    .stage.revealed .note { opacity: var(--o, 0.8); }
  }

  @media (max-width: 420px) {
    .content { padding-bottom: 6vh; gap: 0.65rem; }
    .hero-tulip { width: min(56vw, 240px); top: 42%; }
  }

  /* note card: opens when a floating note is touched */
  .note-modal {
    position: absolute;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8vw;
    background: rgba(10, 4, 20, 0.72);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }

  .note-modal.open {
    opacity: 1;
    pointer-events: auto;
  }

  .note-card {
    position: relative;
    width: 100%;
    max-width: 400px;
    max-height: 78vh;
    overflow-y: auto;
    padding: 2.6rem 2.1rem;
    border-radius: 18px;
    background: linear-gradient(160deg, rgba(45, 21, 80, 0.94), rgba(23, 10, 38, 0.97));
    border: 1px solid rgba(255, 223, 168, 0.25);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 44px rgba(239, 75, 127, 0.2);
    text-align: center;
    transform: scale(0.9);
    transition: transform 0.35s cubic-bezier(.2, .8, .3, 1);
  }

  .note-modal.open .note-card {
    transform: scale(1);
  }

  .note-card-text {
    margin: 0;
    font-family: 'Cormorant Garamond', ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.3rem, 5.2vw, 1.7rem);
    line-height: 1.6;
    color: var(--ink-050);
    text-wrap: balance;
    white-space: pre-line;
  }

  .note-close {
    position: absolute;
    top: 0.7rem;
    right: 0.7rem;
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    color: var(--ink-300);
    font-size: 1.1rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .note-close:hover,
  .note-close:focus-visible {
    background: rgba(255, 255, 255, 0.16);
  }

  @media (prefers-reduced-motion: reduce) {
    .note-modal, .note-card { transition: opacity 0.2s ease; }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Jost:wght@300;400;500&family=Parisienne&display=swap" rel="stylesheet">

<div class="stage">
  <canvas id="stars" aria-hidden="true"></canvas>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="tulipGradCenter" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffe9c2" />
        <stop offset="45%" stop-color="#ff6f9c" />
        <stop offset="100%" stop-color="#d43a6e" />
      </linearGradient>
      <linearGradient id="tulipGradLeft" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e88bb0" />
        <stop offset="50%" stop-color="#c93f6d" />
        <stop offset="100%" stop-color="#8f2c56" />
      </linearGradient>
      <linearGradient id="tulipGradRight" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f2a6c4" />
        <stop offset="50%" stop-color="#d94e7d" />
        <stop offset="100%" stop-color="#9c3560" />
      </linearGradient>
      <symbol id="tulip" viewBox="0 0 100 150">
        <path d="M50,70 C46,92 54,108 49,140" fill="none" stroke="#5c5480" stroke-width="3" stroke-linecap="round" />
        <path d="M49,108 C34,104 21,112 14,128 C29,130 42,124 49,114 Z" fill="#5c5480" />
        <path d="M44,68 C47,72 53,72 56,68 C53,74 47,74 44,68 Z" fill="#4a3f68" opacity="0.9" />
        <path d="M50,70 C39,67 29,58 26,46 C23,34 28,20 40,12 C33,23 32,38 37,50 C40,58 45,65 50,70 Z"
              fill="url(#tulipGradLeft)" stroke="#7a2d52" stroke-width="0.6" stroke-opacity="0.35" />
        <path d="M50,70 C61,67 71,58 74,46 C77,34 72,20 60,12 C67,23 68,38 63,50 C60,58 55,65 50,70 Z"
              fill="url(#tulipGradRight)" stroke="#7a2d52" stroke-width="0.6" stroke-opacity="0.35" />
        <path d="M50,70 C45,59 42,45 42,31 C42,19 45,9 50,3 C55,9 58,19 58,31 C58,45 55,59 50,70 Z"
              fill="url(#tulipGradCenter)" stroke="#8a2f57" stroke-width="0.6" stroke-opacity="0.3" />
      </symbol>
    </defs>
  </svg>

  <button type="button" class="hero-tulip" id="heroTulip" aria-label="Toca el tulipán para leer el mensaje final">
    <svg viewBox="0 0 100 150" aria-hidden="true"><use href="#tulip" /></svg>
  </button>

  <div class="tulip-field" id="tulipField" aria-hidden="true"></div>
  <div class="orbit-field" id="orbitField" aria-hidden="true"></div>
  <div class="notes-field" id="notesField" aria-hidden="true"></div>

  <div class="shooting-star"></div>
  <div class="shooting-star two"></div>

  <main class="content">
    <h1 class="name">Emily</h1>
    <p class="message">Tus Flores Del 29</p>
    <p class="signature">con cariño, Ader</p>
    <p class="tulip-hint" id="tulipHint">toca el tulipán</p>
  </main>

  <button type="button" class="cover" id="cover" aria-label="Toca para revelar tu universo de tulipanes">
    <span class="moon-wrap" aria-hidden="true">
      <span class="moon"></span>
      <span class="tap-ring"></span>
    </span>
    <p class="tap-hint">toca la luna<br>para revelar tu universo</p>
  </button>

  <div class="note-modal" id="noteModal" aria-hidden="true">
    <div class="note-card" role="dialog" aria-modal="true" aria-labelledby="noteModalText">
      <button type="button" class="note-close" id="noteClose" aria-label="Cerrar nota">×</button>
      <p class="note-card-text" id="noteModalText"></p>
    </div>
  </div>
</div>

<script>
  (function () {
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // core interactions are wired up first, before any decorative extras below,
    // so the moon and the tulip always respond even if a decorative bit fails
    var stage = document.querySelector('.stage');
    var cover = document.getElementById('cover');
    var noteModal = document.getElementById('noteModal');
    var noteModalText = document.getElementById('noteModalText');
    var noteClose = document.getElementById('noteClose');
    var heroTulip = document.getElementById('heroTulip');
    var tulipHint = document.getElementById('tulipHint');

    function reveal() {
      if (stage.classList.contains('revealed')) return;
      stage.classList.add('revealed');
      cover.classList.add('hide');
      cover.setAttribute('aria-hidden', 'true');
      cover.disabled = true;
      window.setTimeout(function () {
        cover.style.display = 'none';
      }, reduceMotion ? 60 : 900);
    }

    cover.addEventListener('click', reveal);

    function openNote(message) {
      noteModalText.textContent = message;
      noteModal.classList.add('open');
      noteModal.setAttribute('aria-hidden', 'false');
    }

    function closeNote() {
      noteModal.classList.remove('open');
      noteModal.setAttribute('aria-hidden', 'true');
    }

    noteClose.addEventListener('click', closeNote);
    noteModal.addEventListener('click', function (e) {
      if (e.target === noteModal) closeNote();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeNote();
    });

    var finalMessage = 'No me arrepiento ni de lo malo ni de lo bueno, porque lo bueno me ha enseñado ' +
      'lo bonito que es sentir amor por alguien, y lo malo me ha enseñado que aquello que realmente vale ' +
      'la pena se construye a partir de todo lo que aprendemos en el camino.\n\nAl final, entre tantas cosas ' +
      'que pueden cambiar, hay algo que tengo claro: te quiero, y para mí, eso es lo importante.';
    heroTulip.addEventListener('click', function () { openNote(finalMessage); });

    function rand(a, b) { return a + Math.random() * (b - a); }

    var notesData = [
      { pos: [10, 18], message: 'Conocer la forma en la que das atención cambia mucho la perspectiva de las cosas.' },
      { pos: [86, 20], message: 'Sentir la calidez de tus sentimientos hace que un corazón aclame estar a tu lado siempre.' },
      { pos: [10, 62], message: 'Conocer la abundancia de tus acciones hacia los que quieres, por verlos bien, hace que tu entorno se sienta feliz a tu lado.' },
      { pos: [88, 64], message: 'Extrañarte en tu distancia hace recordar al corazón que no te quiere perder.' },
      { pos: [50, 9], message: 'Esperar a tu ritmo enseña a reconocer que lo bueno tiene su tiempo.' }
    ];
    var readNotes = {};

    function markRead(i) {
      readNotes[i] = true;
      if (Object.keys(readNotes).length >= notesData.length) {
        tulipHint.classList.add('show');
      }
    }

    function clearOfCenter(x, y) {
      if (x > 26 && x < 74 && y > 38 && y < 94) {
        return { x: x, y: y < 66 ? rand(3, 32) : rand(93, 97) };
      }
      return { x: x, y: y };
    }

    // everything from here down is decorative — each piece is wrapped so a
    // hiccup in one (canvas, a generated field) never breaks the interactions above

    try {
      // starfield
      var canvas = document.getElementById('stars');
      var ctx = canvas.getContext('2d');
      var stars = [];
      var dpr = Math.min(window.devicePixelRatio || 1, 2);

      var buildStars = function (w, h) {
        var count = Math.round((w * h) / 7000);
        stars = [];
        for (var i = 0; i < count; i++) {
          stars.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: Math.random() * 1.15 + 0.25,
            phase: Math.random() * Math.PI * 2,
            speed: 0.6 + Math.random() * 1.1,
            warm: Math.random() < 0.18
          });
        }
      };

      var sizeCanvas = function () {
        var w = window.innerWidth, h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        buildStars(w, h);
      };

      var drawStars = function (t) {
        var w = window.innerWidth, h = window.innerHeight;
        ctx.clearRect(0, 0, w, h);
        for (var i = 0; i < stars.length; i++) {
          var s = stars[i];
          var tw = reduceMotion ? 0.85 : (0.5 + 0.5 * Math.sin(t * 0.001 * s.speed + s.phase));
          ctx.globalAlpha = 0.25 + tw * 0.65;
          ctx.fillStyle = s.warm ? '#ffdfa8' : '#f4eaff';
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      };

      var loop = function (t) {
        drawStars(t);
        if (!reduceMotion) requestAnimationFrame(loop);
      };

      window.addEventListener('resize', sizeCanvas);
      sizeCanvas();
      requestAnimationFrame(loop);
      if (reduceMotion) drawStars(0);
    } catch (err) { /* starfield is purely decorative */ }

    try {
      // tulip field: three depth layers scattered around the hero
      var field = document.getElementById('tulipField');
      var layers = [
        { count: 9,  size: [22, 34],  opacity: [0.18, 0.32], hue: [-18, 10],  dur: [11, 15] }, // far
        { count: 8,  size: [34, 50],  opacity: [0.35, 0.55], hue: [-10, 18],  dur: [8, 12] },  // mid
        { count: 6,  size: [52, 78],  opacity: [0.6, 0.85],  hue: [-6, 22],   dur: [6, 9] }    // near
      ];

      layers.forEach(function (layer) {
        for (var i = 0; i < layer.count; i++) {
          var el = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          el.classList.add('tulip-inst');
          el.setAttribute('viewBox', '0 0 100 150');
          var use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
          use.setAttribute('href', '#tulip');
          use.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '#tulip');
          el.appendChild(use);

          var x = rand(4, 96);
          var y = rand(4, 96);
          // keep clear space around the centered headline
          if (x > 28 && x < 72 && y > 40 && y < 92) {
            y = y < 66 ? rand(4, 34) : rand(92, 96);
          }

          el.style.setProperty('--x', x + '%');
          el.style.setProperty('--y', y + '%');
          el.style.setProperty('--w', rand(layer.size[0], layer.size[1]) + 'px');
          el.style.setProperty('--o', rand(layer.opacity[0], layer.opacity[1]));
          el.style.setProperty('--hue', rand(layer.hue[0], layer.hue[1]) + 'deg');
          el.style.setProperty('--r', rand(-8, 8) + 'deg');
          el.style.setProperty('--dur', rand(layer.dur[0], layer.dur[1]) + 's');
          el.style.setProperty('--delay', rand(0, 4) + 's');
          el.style.setProperty('--glow', 'rgba(239,75,127,0.45)');

          field.appendChild(el);
        }
      });
    } catch (err) { /* tulip field is purely decorative */ }

    try {
      // small planets adrift among the tulips
      var orbitField = document.getElementById('orbitField');
      var planetSkins = [
        ['#c9a6ff', '#7c3aed', '#2d1550'],
        ['#ffd9a0', '#ef4b7f', '#6e2148'],
        ['#ffe9c2', '#b48bf2', '#3a1a5c']
      ];
      for (var p = 0; p < 7; p++) {
        var pos = clearOfCenter(rand(3, 97), rand(3, 97));
        var skin = planetSkins[p % planetSkins.length];
        var el2 = document.createElement('div');
        el2.className = 'planet-inst' + (p % 3 === 0 ? ' ringed' : '');
        el2.style.setProperty('--x', pos.x + '%');
        el2.style.setProperty('--y', pos.y + '%');
        el2.style.setProperty('--w', rand(10, 26) + 'px');
        el2.style.setProperty('--o', rand(0.5, 0.9));
        el2.style.setProperty('--r', rand(-6, 6) + 'deg');
        el2.style.setProperty('--dur', rand(9, 14) + 's');
        el2.style.setProperty('--delay', rand(0, 4) + 's');
        el2.style.setProperty('--pgrad', 'radial-gradient(circle at 35% 30%, ' + skin[0] + ', ' + skin[1] + ' 55%, ' + skin[2] + ' 100%)');
        el2.style.setProperty('--glow2', 'rgba(180,139,242,0.45)');
        orbitField.appendChild(el2);
      }
    } catch (err) { /* planet field is purely decorative */ }

    try {
      // five little charms drifting like constellations — tap one to open it large
      var notesField = document.getElementById('notesField');
      notesData.forEach(function (item, i) {
        var pc = clearOfCenter(item.pos[0], item.pos[1]);
        var el3 = document.createElement('button');
        el3.type = 'button';
        el3.className = 'note';
        el3.textContent = String(i + 1);
        el3.setAttribute('aria-label', 'Abrir nota ' + (i + 1));
        el3.style.setProperty('--x', pc.x + '%');
        el3.style.setProperty('--y', pc.y + '%');
        el3.style.setProperty('--o', rand(0.75, 0.95));
        el3.style.setProperty('--r', rand(-4, 4) + 'deg');
        el3.style.setProperty('--dur', rand(10, 15) + 's');
        el3.style.setProperty('--delay', rand(0.4, 3.5) + 's');
        el3.addEventListener('click', function () {
          openNote(item.message);
          markRead(i);
        });
        notesField.appendChild(el3);
      });
    } catch (err) { /* notes field falls back to no floating charms */ }
  })();
</script>
